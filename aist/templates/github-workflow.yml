name: AI Security Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9am UTC
  workflow_dispatch:      # Manual trigger from UI

jobs:
  aist-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AIST
        run: pip install aist

      - name: Run AI Security Scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AIST_CANARY_EMAIL: ${{ secrets.AIST_CANARY_EMAIL }}
          AIST_CANARY_URL: ${{ secrets.AIST_CANARY_URL }}
        run: |
          aist scan \
            --target ${{ secrets.AI_AGENT_URL }} \
            --profile standard \
            --fail-on high \
            --operator "CI/CD" \
            --log-level WARNING

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/
        continue-on-error: true

      - name: Upload scan reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aist-scan-reports
          path: reports/
          retention-days: 30
